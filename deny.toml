# cargo-deny configuration (issue #365). Applies to core/ and orchestrator/.
# NOTE: authored without running cargo-deny; the first CI run may need the
# license allow-list or the ignore list adjusted against the real dependency tree.

[graph]
targets = [
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Time-bounded ignores only. Every entry MUST carry a reason and a review-by date:
#   { id = "RUSTSEC-YYYY-NNNN", reason = "unfixable transitive dep of soroban-sdk; review by 2027-01-31" },
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
