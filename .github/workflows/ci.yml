name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  relayer:
    name: Gasless Relayer (Node/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/relayer/package-lock.json

      - name: Install relayer dependencies
        run: npm ci
        working-directory: services/relayer

      - name: Typecheck relayer
        run: npm run typecheck
        working-directory: services/relayer

      - name: Test relayer
        run: npm test
        working-directory: services/relayer

  matrix-test:
    name: Matrix Test (${{ matrix.os }} - Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Stellar CLI
        run: curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh -s -- --dir ~/.cargo/bin

      - name: Format Check
        run: |
          make fmt
          git diff --exit-code

      - name: Clippy Lints (core & orchestrator)
        run: |
          make clippy

      - name: Build Contracts
        run: |
          make build

      - name: Run Tests (core & orchestrator)
        run: |
          make test

  coverage:
    name: Code Coverage (Rust + TS + Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Rust coverage (core)
        run: |
          mkdir -p coverage
          cd core
          cargo llvm-cov --workspace --lcov --output-path ../coverage/core-lcov.info \
            --ignore-filename-regex '(_test\.rs|test_.*\.rs|test_utils/)'
          cargo llvm-cov report --summary-only | tee ../coverage/core-summary.txt

      - name: Collect Rust coverage (orchestrator)
        run: |
          cd orchestrator
          cargo llvm-cov --workspace --lcov --output-path ../coverage/orchestrator-lcov.info \
            --ignore-filename-regex '(_test\.rs|test_.*\.rs|test_utils/)'
          cargo llvm-cov report --summary-only | tee ../coverage/orchestrator-summary.txt

      - name: Collect TypeScript SDK coverage (Vitest)
        run: |
          cd sdk/typescript
          npm ci
          npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../../coverage/ts-sdk || true

      - name: Collect Python SDK coverage (pytest-cov)
        run: |
          cd sdk/python
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov || pip install pytest pytest-cov
          python -m pytest --cov=. --cov-report=lcov:../../coverage/py-sdk-lcov.info --cov-report=term || true

      - name: Write coverage summary to GitHub Actions
        run: |
          {
            echo "## Coverage Summary"
            echo ""
            echo "| Component | Report |"
            echo "|-----------|--------|"
            echo "| core (payment/escrow/refund) | \`coverage/core-summary.txt\` |"
            echo "| orchestrator | \`coverage/orchestrator-summary.txt\` |"
            echo "| ts-sdk | \`coverage/ts-sdk/lcov.info\` |"
            echo "| py-sdk | \`coverage/py-sdk-lcov.info\` |"
            echo ""
            echo "### Rust per-crate line/branch coverage"
            echo ""
            echo '```'
            cat coverage/core-summary.txt 2>/dev/null || echo "core summary unavailable"
            echo ""
            cat coverage/orchestrator-summary.txt 2>/dev/null || echo "orchestrator summary unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LCOV reports (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: |
            coverage/core-lcov.info
            coverage/orchestrator-lcov.info
            coverage/ts-sdk/lcov.info
            coverage/py-sdk-lcov.info
          flags: payment,escrow,refund,orchestrator,ts-sdk,py-sdk

  crank-worker:
    name: Crank Worker (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/crank-worker/package-lock.json

      - name: Install dependencies
        working-directory: services/crank-worker
        run: npm ci

      - name: Typecheck and test
        working-directory: services/crank-worker
        run: npm test

  security-scan:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Security Advisory Audit (cargo-audit)
        run: |
          which cargo-audit || cargo install cargo-audit --locked || true
          cd core && cargo audit || true
          cd ../orchestrator && cargo audit || true

      - name: Budget Regression Gate (core)
        run: make budget-bench
        working-directory: core

      - name: Run Tests (orchestrator)
        run: cargo test --workspace 2>&1 | tee test-output.txt
        working-directory: orchestrator

      - name: Build Deterministic Optimized WASM & Checksum Manifest (SEP-42)
        env:
          RUSTFLAGS: "-C link-arg=-s --remap-path-prefix=${{ github.workspace }}=/workspace"
        run: |
          rustup target add wasm32-unknown-unknown
          mkdir -p artifacts/optimized
          
          # Core contracts
          cd core
          cargo build --target wasm32-unknown-unknown --release
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              base=$(basename "$wasm")
              stellar contract optimize --wasm "$wasm"
              cp "$wasm" "../artifacts/optimized/$base"
            fi
          done
          cd ..

          # Orchestrator contracts
          cd orchestrator
          cargo build --target wasm32-unknown-unknown --release
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              base=$(basename "$wasm")
              stellar contract optimize --wasm "$wasm"
              cp "$wasm" "../artifacts/optimized/$base"
            fi
          done
          cd ..

          # Verify size budgets (<= 64 KB budget for optimized contracts)
          cd artifacts/optimized
          for wasm in *.wasm; do
            size=$(wc -c < "$wasm")
            echo "$wasm size: $size bytes"
            if [ "$size" -gt 65536 ]; then
              echo "Warning: $wasm exceeds 64KB target ($size bytes)"
            fi
          done

          # Generate sha256 checksum manifest
          sha256sum *.wasm > checksums.sha256
          cat checksums.sha256

      - name: Upload SEP-42 WASM & Checksums Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-checksums
          path: |
            artifacts/optimized/*.wasm
            artifacts/optimized/checksums.sha256
