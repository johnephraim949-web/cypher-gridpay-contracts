name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  relayer:
    name: Gasless Relayer (Node/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/relayer/package-lock.json

      - name: Install relayer dependencies
        run: npm ci
        working-directory: services/relayer

      - name: Typecheck relayer
        run: npm run typecheck
        working-directory: services/relayer

      - name: Test relayer
        run: npm test
        working-directory: services/relayer

  web:
    name: Merchant Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Typecheck web utilities and pages
        run: npm run typecheck
        working-directory: apps/web

      - name: Test forwarding loop detection and StrKey validation
        run: npm test
        working-directory: apps/web

  matrix-test:
    name: Matrix Test (${{ matrix.os }} - Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Stellar CLI
        run: curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh -s -- --dir ~/.cargo/bin

      - name: Format Check
        run: |
          make fmt
          git diff --exit-code

      - name: Clippy Lints (core & orchestrator)
        run: |
          make clippy

      - name: Build Contracts
        run: |
          make build

      - name: Run Tests (core & orchestrator)
        run: |
          make test

  crank-worker:
    name: Crank Worker (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/crank-worker/package-lock.json

      - name: Install dependencies
        working-directory: services/crank-worker
        run: npm ci

      - name: Typecheck and test
        working-directory: services/crank-worker
        run: npm test

  security-scan:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Security Advisory Audit (cargo-audit)
        run: |
          which cargo-audit || cargo install cargo-audit --locked || true
          cd core && cargo audit || true
          cd ../orchestrator && cargo audit || true

      - name: Budget Regression Gate
        # Moved to the dedicated `budget-bench` job below (issue #378) so the
        # structured JSON metrics artifact + PR comparison can be produced.
        run: echo "Budget bench now runs in the budget-bench job."

      - name: Run Tests (orchestrator)
        run: cargo test --workspace 2>&1 | tee test-output.txt
        working-directory: orchestrator

      - name: Build Deterministic Optimized WASM & Checksum Manifest (SEP-42)
        env:
          RUSTFLAGS: "-C link-arg=-s --remap-path-prefix=${{ github.workspace }}=/workspace"
        run: |
          rustup target add wasm32-unknown-unknown
          mkdir -p artifacts/optimized
          
          # Core contracts
          cd core
          cargo build --target wasm32-unknown-unknown --release
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              base=$(basename "$wasm")
              stellar contract optimize --wasm "$wasm"
              cp "$wasm" "../artifacts/optimized/$base"
            fi
          done
          cd ..

          # Orchestrator contracts
          cd orchestrator
          cargo build --target wasm32-unknown-unknown --release
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              base=$(basename "$wasm")
              stellar contract optimize --wasm "$wasm"
              cp "$wasm" "../artifacts/optimized/$base"
            fi
          done
          cd ..

          # Verify size budgets (<= 64 KB budget for optimized contracts)
          cd artifacts/optimized
          for wasm in *.wasm; do
            size=$(wc -c < "$wasm")
            echo "$wasm size: $size bytes"
            if [ "$size" -gt 65536 ]; then
              echo "Warning: $wasm exceeds 64KB target ($size bytes)"
            fi
          done

          # Generate sha256 checksum manifest
          sha256sum *.wasm > checksums.sha256
          cat checksums.sha256

      - name: Upload SEP-42 WASM & Checksums Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contract-wasm-checksums
          path: |
            artifacts/optimized/*.wasm
            artifacts/optimized/checksums.sha256

  # ===========================================================================
  # Budget Benchmark Regression Tracking (issue #378)
  #
  # Builds contracts to WASM, runs `make budget-bench` with structured JSON
  # output, uploads `budget-metrics.json` (the baseline for future PRs), and —
  # on pull requests — downloads the main-branch baseline and computes
  # per-entrypoint CPU / memory / WASM deltas. A regression beyond the fail
  # threshold (>15%) or a Soroban ledger-cap breach fails the CI gate. The
  # sticky PR comment is posted by the fork-safe `budget-comment` workflow_run
  # (see .github/workflows/budget-comment.yml) so no write token is exposed to
  # untrusted fork-PR code.
  # ===========================================================================
  budget-bench:
    name: Budget Bench & Regression Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # needed to read main-branch workflow-run artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown

      - name: Build contracts to WASM (release)
        working-directory: core
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Measure WASM sizes → WASM_BYTES_* env vars
        working-directory: core
        run: |
          set -euo pipefail
          dir="target/wasm32-unknown-unknown/release"
          # Map wasm file basenames → contract keys used by budget_bench.rs.
          for f in "$dir"/*.wasm; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .wasm)
            size=$(wc -c < "$f" | tr -d ' ')
            echo "$base.wasm = $size bytes"
            # Contract keys match the `contract` field in budget_bench.rs.
            case "$base" in
              payments|payment) echo "WASM_BYTES_PAYMENT=$size" >> "$GITHUB_ENV" ;;
              escrow)           echo "WASM_BYTES_ESCROW=$size" >> "$GITHUB_ENV" ;;
              refund)           echo "WASM_BYTES_REFUND=$size" >> "$GITHUB_ENV" ;;
              admin)            echo "WASM_BYTES_ADMIN=$size" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Run budget-bench (structured JSON output)
        working-directory: core
        env:
          BUDGET_METRICS_OUT: target/budget-metrics.jsonl
        run: make budget-bench

      - name: Assemble JSONL → budget-metrics.json (array)
        run: |
          python3 - <<'PY'
          import json, os
          src = "core/target/budget-metrics.jsonl"
          out = "budget-metrics.json"
          records = []
          if os.path.exists(src):
              with open(src) as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          records.append(json.loads(line))
          with open(out, "w") as f:
              json.dump(records, f, indent=2)
          print(f"Wrote {len(records)} metric record(s) to {out}")
          PY

      - name: Upload budget-metrics.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-metrics
          path: budget-metrics.json
          retention-days: 90

      # On PRs: fetch the main-branch baseline and run the comparison gate.
      - name: Download main baseline (PR only)
        if: github.event_name == 'pull_request'
        id: baseline
        continue-on-error: true   # graceful first-run / missing baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          # Find the latest successful CI/CD run on main.
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "ci.yml" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No successful main run found — will record current metrics as baseline."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest successful main run: $run_id"
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
               --name budget-metrics --dir baseline; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Baseline artifact not present on main run yet — first run."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare against baseline (regression gate)
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.baseline.outputs.found }}" = "true" ] && [ -f baseline/budget-metrics.json ]; then
            python3 scripts/compare-budget-bench.py \
              --current budget-metrics.json \
              --baseline baseline/budget-metrics.json \
              --output budget-comparison.md \
              --warn-pct 5 --fail-pct 15 \
              --enforce
          else
            # No baseline yet: record current metrics without failing the PR.
            python3 scripts/compare-budget-bench.py \
              --current budget-metrics.json \
              --output budget-comparison.md
          fi

      - name: Upload budget comparison (for the PR comment workflow)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: budget-comparison
          path: budget-comparison.md

