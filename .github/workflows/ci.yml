name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  error-catalog:
    name: Error Catalog Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify error catalog is in sync
        run: python3 scripts/generate-error-catalog.py --check
