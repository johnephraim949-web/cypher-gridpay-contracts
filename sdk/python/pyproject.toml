[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher-gridpay-sdk"
version = "0.2.0"
description = "Async typed Python SDK for Cypher GridPay Soroban contracts"
requires-python = ">=3.10"
dependencies = [
    "stellar-sdk>=13,<14",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cypher_gridpay --cov-report=term-missing --cov-report=lcov:coverage.lcov"

[tool.coverage.run]
source = ["cypher_gridpay"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]