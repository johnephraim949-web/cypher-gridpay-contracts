{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gridpay-secrets
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: gridpay-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: {{ .Values.externalSecrets.remoteRefs.databaseUrl | quote }}}
    - secretKey: REDIS_URL
      remoteRef: {key: {{ .Values.externalSecrets.remoteRefs.redisUrl | quote }}}
    - secretKey: SIGNER_KMS_KEY_ID
      remoteRef: {key: {{ .Values.externalSecrets.remoteRefs.signerKmsKeyId | quote }}}
{{- end }}
