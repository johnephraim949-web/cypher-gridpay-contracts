{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gridpay-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: gridpay
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        {{- range $.Values.networkPolicy.egressPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
